[project]
name = "refmeta"
version = "0.0.1"
description = "Convert reference genome metadata between formats through one shared model"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
refmeta = "refmeta.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refmeta"]
