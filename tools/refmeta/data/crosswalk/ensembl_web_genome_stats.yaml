# refmeta crosswalk: ensembl_web_genome_stats <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: ensembl_web_genome_stats
source: ensembl
core: '0.1'
subject: assembly
description: New Ensembl metadata API /api/metadata/genome/{genome_id}/stats; nested objects flattened with '.'.
  Only assembly_stats are about the sequences; the rest are annotation statistics.
records: {mode: each}
constants: {}
derive: []
rules:
- native: genome_stats.assembly_stats.contig_n50
  core: assembly.vitalStats.N50
  direction: both
  transform: null
  lossy: null
  example: {native: 54806562, core: 54806562, file: examples/web_stats_GCA_000001405.29.json}
- native: genome_stats.assembly_stats.gc_percentage
  core: assembly.vitalStats.gcContent
  direction: both
  transform: null
  lossy: null
  example: {native: 38.88, core: 38.88, file: examples/web_stats_GCA_000001405.29.json}
- native: genome_stats.assembly_stats.chromosomes
  core: assembly.vitalStats.numberChromosomes
  direction: both
  transform: null
  lossy: null
  example: {native: 25, core: 25, file: examples/web_stats_GCA_000001405.29.json}
unmapped:
