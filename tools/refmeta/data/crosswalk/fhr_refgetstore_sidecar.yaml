# refmeta crosswalk: fhr_refgetstore_sidecar <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: fhr_refgetstore_sidecar
source: fhr
core: '0.1'
subject: collection
description: 'RefgetStore FHR sidecar: gtars FhrMetadata serialized as JSON at <store>/fhr/<seqcol digest>.fhr.json
  (refgenie''s public stores)'
records: {mode: each}
notes: One sidecar per sequence collection in a RefgetStore, named <seqcol digest>.fhr.json. assemblySource and
  assemblyLevel are refgenie extension keys kept by gtars.
constants: {}
derive: []
rules:
- native: genome
  core: collection.labels[namespace=fhr.genome].value
  direction: both
  transform: null
  fallback: ['collection.aliases[namespace=refgenie].value', assembly.name]
  lossy: FHR calls this the name of the genome. refgenie writes its collection name (hg38), the upstream examples
    an assembly name. Kept as a non-unique label on the collection; on write, falls back to the refgenie alias,
    then the assembly name.
  example: {native: homo_sapiens_ENSEMBL_release_81, core: homo_sapiens_ENSEMBL_release_81, file: examples/sidecar_GRCh38-ensembl81_plantcore_EpUZgR6X_cEphzw9gboSc86rumZpXthc.fhr.json}
- native: genomeSynonym
  core: collection.labels[namespace=fhr.synonym].value
  direction: both
  transform: null
  fallback: ['collection.labels[namespace=refgenie.synonym].value']
  lossy: 'Level is unclear: refgenie writes collection aliases here (GRCh38 for hg38). Kept as non-unique labels
    on the collection.'
  example:
    native: &id001 [GRCh38-81-ensembl]
    core: *id001
    file: examples/sidecar_GRCh38-ensembl81_plantcore_EpUZgR6X_cEphzw9gboSc86rumZpXthc.fhr.json
- native: taxon.name
  core: assembly.taxon.name
  direction: both
  transform: null
  lossy: null
  example: {native: Homo sapiens, core: Homo sapiens, file: examples/sidecar_GRCh38-ensembl81_plantcore_EpUZgR6X_cEphzw9gboSc86rumZpXthc.fhr.json}
- native: taxon.uri
  core: assembly.taxon.id
  direction: both
  transform:
    regex: {pattern: 'taxonomy:(\d+)$', as: integer, template: 'https://identifiers.org/taxonomy:{}'}
  lossy: Only identifiers.org taxonomy URIs give a number; on write the URI is rebuilt in that form.
  example: {native: 'https://identifiers.org/taxonomy:9606', core: 9606, file: examples/sidecar_GRCh38-ensembl81_plantcore_EpUZgR6X_cEphzw9gboSc86rumZpXthc.fhr.json}
- native: version
  core: assembly.version
  direction: both
  transform: null
  lossy: null
  example: {native: '40', core: '40', file: examples/sidecar_GRCh38.p14-ncbi_jungle_u1HyLgIlq8M_XvEwy0oGqAvKGHJMGtxH.fhr.json}
- {native: 'metadataAuthor[].name', core: 'provenance[0].authors[].name', direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- {native: 'metadataAuthor[].uri', core: 'provenance[0].authors[].uri', direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- {native: 'assemblyAuthor[].name', core: 'assembly.assemblyAuthor[].name', direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- {native: 'assemblyAuthor[].uri', core: 'assembly.assemblyAuthor[].uri', direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- {native: dateCreated, core: assembly.dateCreated, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: voucherSpecimen, core: assembly.voucherSpecimen, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- native: accessionID.name
  core: assembly.accessions
  direction: both
  transform:
    accession: {other: unspecified}
  lossy: FHR accessionID is any archive's id (the upstream example has PBARC, inherited from the 2022 field 'place');
    refmeta treats it as the assembly accession.
  example:
    native: GCF_000001405.40
    core: {namespace: insdc.gcf, value: GCF_000001405.40}
    file: examples/sidecar_GRCh38.p14-ncbi_jungle_u1HyLgIlq8M_XvEwy0oGqAvKGHJMGtxH.fhr.json
- native: accessionID.url
  core: assembly.accessions[0].url
  direction: both
  transform: null
  lossy: null
  example: {native: 'https://www.ncbi.nlm.nih.gov/datasets/genome/GCF_000001405.40/', core: 'https://www.ncbi.nlm.nih.gov/datasets/genome/GCF_000001405.40/',
    file: examples/sidecar_GRCh38.p14-ncbi_jungle_u1HyLgIlq8M_XvEwy0oGqAvKGHJMGtxH.fhr.json}
- {native: instrument, core: assembly.instrument, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: scholarlyArticle, core: assembly.scholarlyArticle, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- native: documentation
  core: assembly.documentation
  direction: both
  transform: null
  fallback: [collection.description, assembly.description]
  lossy: null
  example: {native: 'GRCh38 from Ensembl release 81, all 493 top-level sequences: chromosomes 1-22,

      X, Y and MT, 169 unplaced and unlocalized scaffolds, and 299 haplotype and

      pat...', core: 'GRCh38 from Ensembl release 81, all 493 top-level sequences: chromosomes 1-22,

      X, Y and MT, 169 unplaced and unlocalized scaffolds, and 299 haplotype and

      pat...', file: examples/sidecar_GRCh38-ensembl81_plantcore_EpUZgR6X_cEphzw9gboSc86rumZpXthc.fhr.json, truncated: true}
- {native: identifier, core: assembly.identifier, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- native: relatedLink
  core: assembly.relatedLink
  direction: both
  transform: null
  lossy: null
  example:
    native: &id002 ['https://lh3.github.io/2017/11/13/which-human-reference-genome-to-use', 'ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz']
    core: *id002
    file: examples/sidecar_hg38_jungle_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.fhr.json
- {native: funding, core: assembly.funding, direction: both, transform: null, lossy: null, example: null, note: No
    example file sets this field.}
- {native: reuseConditions, core: assembly.reuseConditions, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: license, core: assembly.reuseConditions, direction: both, transform: null, lossy: 'gtars/refgenie field,
    not FHR. Shares the core field with FHR reuseConditions (an SPDX id there, free text in FHR).', example: null,
  note: No example file sets this field.}
- {native: masking, core: 'copies[kind=fasta].masking', direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: vitalStats.totalBasePairs, core: assembly.vitalStats.totalBasePairs, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: vitalStats.N50, core: assembly.vitalStats.N50, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: vitalStats.L50, core: assembly.vitalStats.L50, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: vitalStats.L90, core: assembly.vitalStats.L90, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: vitalStats.numberContigs, core: assembly.vitalStats.numberContigs, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: vitalStats.numberScaffolds, core: assembly.vitalStats.numberScaffolds, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: vitalStats.readTechnology, core: assembly.vitalStats.readTechnology, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: checksum, core: 'copies[kind=fasta].checksums.fhr', direction: both, transform: null, lossy: 'FHR checksum:
    SHA-512/256, base64, over the file without its checksum line. Not a plain file checksum and not a refget digest.',
  example: null, note: No example file sets this field.}
- {native: assemblySoftware, core: 'assembly.assemblySoftware[0].name', direction: to_core, transform: null, lossy: Legacy
    single-string form; any version inside the string stays in the name. Read only; refmeta writes the object
    form instead because an FHR record cannot hold both forms., example: null, note: No example file sets
    this field.}
- {native: assemblyProtocol, core: assembly.assemblyProtocol, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: seqcol_id, core: collection.digest, direction: both, transform: null, lossy: Supplied by the record's
    author and never verified; a seqcol_digests derivation on sequences may disagree., example: null, note: No example
    file sets this field.}
- {native: seqcolDigest, core: collection.digest, direction: both, transform: null, lossy: null, example: null,
  note: 'Not in the JSON body: the adapter cannot see it; refmeta.formats.fhr.sidecar_digest(filename) reads it
    from the file name.'}
- native: assemblySource
  core: collection.provider
  direction: both
  transform: null
  lossy: Values are not normalized (ncbi, NCBI, Ensembl, UCSC).
  example: {native: Ensembl, core: Ensembl, file: examples/sidecar_GRCh38-ensembl81_plantcore_EpUZgR6X_cEphzw9gboSc86rumZpXthc.fhr.json}
- native: assemblyLevel
  core: assembly.level
  direction: both
  transform: null
  lossy: null
  example: {native: chromosome, core: chromosome, file: examples/sidecar_GRCh38.p14-ncbi_jungle_u1HyLgIlq8M_XvEwy0oGqAvKGHJMGtxH.fhr.json}
unmapped:
- {native: schema, reason: 'URL of the FHR schema the record follows: a property of the record format, not of the
    genome.'}
- {native: schemaVersion, reason: 'FHR contract version, written as the number 1.0 by gtars: a property of the record
    format.'}
