# refmeta crosswalk: ncbi_assembly_report_sequences <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: ncbi_assembly_report_sequences
source: ncbi
core: '0.1'
subject: assembly
description: 'Tab-separated table of the FTP *_assembly_report.txt: one row per top-level sequence, giving its submitter
  name, role, chromosome, GenBank and RefSeq accessions, assembly unit, length and UCSC-style name. This is NCBI''s
  main name map across naming styles.'
records:
  mode: group
  group_by: []
  rows: {target: sequences, key: null, explode: null}
notes: The assembly's sequences; names live in aliases. 'na' marks missing values.
constants: {}
derive: []
rules:
- native: Sequence-Name
  core: sequences[].aliases[namespace=assembly].value
  direction: both
  transform: null
  lossy: null
  example: {native: '1', core: '1', file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: Sequence-Role
  core: sequences[].role
  direction: both
  transform: null
  lossy: null
  example: {native: assembled-molecule, core: assembled-molecule, file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: Assigned-Molecule
  core: sequences[].assignedMolecule
  direction: both
  transform: null
  missing: na
  lossy: null
  example: {native: '1', core: '1', file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: Assigned-Molecule-Location/Type
  core: sequences[].molecule
  direction: both
  transform: null
  missing: na
  lossy: null
  example: {native: Chromosome, core: Chromosome, file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: GenBank-Accn
  core: sequences[].aliases[namespace=insdc].value
  direction: both
  transform: null
  missing: na
  lossy: null
  example: {native: CM000663.2, core: CM000663.2, file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: RefSeq-Accn
  core: sequences[].aliases[namespace=refseq].value
  direction: both
  transform: null
  missing: na
  lossy: null
  example: {native: NC_000001.11, core: NC_000001.11, file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: Assembly-Unit
  core: sequences[].assemblyUnit
  direction: both
  transform: null
  lossy: null
  example: {native: Primary Assembly, core: Primary Assembly, file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: Sequence-Length
  core: sequences[].length
  direction: both
  transform: null
  lossy: null
  example: {native: 248956422, core: 248956422, file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
- native: UCSC-style-name
  core: sequences[].aliases[namespace=ucsc].value
  direction: both
  transform: null
  missing: na
  lossy: null
  example: {native: chr1, core: chr1, file: examples/ftp_GCA_000001405.15_GRCh38_assembly_report.txt}
unmapped:
- {native: Relationship, per: row, reason: '''='' when the GenBank and RefSeq sequence are identical; no core field.'}
