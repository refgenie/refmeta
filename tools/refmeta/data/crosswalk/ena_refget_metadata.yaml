# refmeta crosswalk: ena_refget_metadata <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: ena_refget_metadata
source: ena
core: '0.1'
subject: assembly
description: ENA CRAM Reference Registry (a GA4GH refget 2.0 server, md5 only) sequence metadata, https://www.ebi.ac.uk/ena/cram/sequence/<id>/metadata.
  Example files hold one served response per line (JSON Lines).
records:
  mode: group
  group_by: []
  rows: {target: sequences, key: null, explode: null}
constants: {}
derive: []
rules:
- native: metadata.md5
  core: sequences[].md5
  direction: both
  transform: null
  lossy: null
  example: {native: 6aef897c3d6ff0c78aff06ac189178dd, core: 6aef897c3d6ff0c78aff06ac189178dd, file: examples/refget_metadata_GCA_000001405.15.jsonl}
- native: metadata.length
  core: sequences[].length
  direction: both
  transform: null
  lossy: null
  example: {native: 248956422, core: 248956422, file: examples/refget_metadata_GCA_000001405.15.jsonl}
- {native: metadata.ga4gh, core: 'sequences[].digest', direction: both, transform: null, lossy: null, example: null,
  note: ENA always sends null.}
- native: metadata.aliases
  core: sequences[].aliases
  direction: both
  transform:
    rekey:
      keys: {alias: value, naming_authority: namespace}
      values:
        namespace: {INSDC: insdc}
  lossy: INSDC is lower-cased to the refget-recommended insdc.
  example:
    native:
    - {alias: CM000663.2, naming_authority: INSDC}
    core:
    - {value: CM000663.2, namespace: insdc}
    file: examples/refget_metadata_GCA_000001405.15.jsonl
unmapped:
- {native: metadata.id, per: row, reason: Echo of the identifier the client asked for.}
- {native: metadata.trunc512, per: row, reason: Deprecated digest form; ENA always sends null.}
- {native: metadata.aliases.alias, per: row, reason: Member of metadata.aliases; mapped through the metadata.aliases
    rule.}
- {native: metadata.aliases.naming_authority, per: row, reason: Member of metadata.aliases; mapped through the metadata.aliases
    rule.}
