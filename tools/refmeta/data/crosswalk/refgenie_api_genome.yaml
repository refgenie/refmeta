# refmeta crosswalk: refgenie_api_genome <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: refgenie_api_genome
source: refgenie
core: '0.1'
subject: collection
description: refgenie 1.x server genome record, GET https://api.refgenie.org/v4/genomes/{digest} (OpenAPI schema
  GenomeDetailResponse). The genome DB columns (refgenie/db/tables.py GenomePublic) plus the species row and the
  genome's FHR sidecar under 'fhr'.
records: {mode: each}
constants: {}
derive: []
rules:
- native: digest
  core: collection.digest
  direction: both
  transform: null
  lossy: null
  example: {native: EiFob05aCWgVU_B_Ae0cypnQut3cxUP1, core: EiFob05aCWgVU_B_Ae0cypnQut3cxUP1, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: description
  core: collection.description
  direction: both
  transform: null
  lossy: null
  example: {native: 'Homo sapiens GRCh38 no-alt analysis set (GCA_000001405.15, UCSC-style names), distributed by
      NCBI GenBank and redistributed identically by Broad, iGenomes, a...', core: 'Homo sapiens GRCh38 no-alt analysis
      set (GCA_000001405.15, UCSC-style names), distributed by NCBI GenBank and redistributed identically by Broad,
      iGenomes, a...', file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json, truncated: true}
- native: species_name
  core: assembly.taxon.name
  direction: both
  transform: null
  lossy: null
  example: {native: Homo sapiens, core: Homo sapiens, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: synonyms
  core: collection.labels[namespace=refgenie.synonym].value
  direction: both
  transform: null
  lossy: null
  example:
    native: &id001 [GRCh38]
    core: *id001
    file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json
- native: taxon_id
  core: assembly.taxon.id
  direction: both
  transform: null
  lossy: null
  example: {native: 9606, core: 9606, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: assembly_source
  core: collection.provider
  direction: both
  transform: null
  lossy: Values are not normalized (ncbi, Ensembl, UCSC).
  example: {native: ncbi, core: ncbi, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: assembly_accession
  core: assembly.accessions
  direction: both
  transform:
    accession: {}
  lossy: null
  example:
    native: GCA_000001405.15
    core: {namespace: insdc.gca, value: GCA_000001405.15}
    file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json
- native: assembly_level
  core: assembly.level
  direction: both
  transform: null
  lossy: null
  example: {native: chromosome, core: chromosome, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: common_name
  core: assembly.taxon.commonName
  direction: both
  transform: null
  lossy: null
  example: {native: human, core: human, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- {native: remote_url, core: 'copies[kind=fasta].location', direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- native: taxon_uri
  core: assembly.taxon.id
  direction: both
  transform:
    regex: {pattern: 'taxonomy:(\d+)$', as: integer, template: 'https://identifiers.org/taxonomy:{}'}
  lossy: null
  example: {native: 'https://identifiers.org/taxonomy:9606', core: 9606, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: fhr.genome
  core: collection.labels[namespace=fhr.genome].value
  direction: both
  transform: null
  fallback: ['collection.aliases[namespace=refgenie].value', assembly.name]
  lossy: FHR calls this the name of the genome. refgenie writes its collection name (hg38), the upstream examples
    an assembly name. Kept as a non-unique label on the collection; on write, falls back to the refgenie alias,
    then the assembly name.
  example: {native: hg38, core: hg38, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: fhr.genomeSynonym
  core: collection.labels[namespace=fhr.synonym].value
  direction: both
  transform: null
  fallback: ['collection.labels[namespace=refgenie.synonym].value']
  lossy: 'Level is unclear: refgenie writes collection aliases here (GRCh38 for hg38). Kept as non-unique labels
    on the collection.'
  example:
    native: &id002 [GRCh38]
    core: *id002
    file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json
- native: fhr.taxon.name
  core: assembly.taxon.name
  direction: both
  transform: null
  lossy: null
  example: {native: Homo sapiens, core: Homo sapiens, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: fhr.taxon.uri
  core: assembly.taxon.id
  direction: both
  transform:
    regex: {pattern: 'taxonomy:(\d+)$', as: integer, template: 'https://identifiers.org/taxonomy:{}'}
  lossy: Only identifiers.org taxonomy URIs give a number; on write the URI is rebuilt in that form.
  example: {native: 'https://identifiers.org/taxonomy:9606', core: 9606, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: fhr.version
  core: assembly.version
  direction: both
  transform: null
  lossy: null
  example: {native: '15', core: '15', file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- {native: 'fhr.metadataAuthor[].name', core: 'provenance[0].authors[].name', direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: 'fhr.metadataAuthor[].uri', core: 'provenance[0].authors[].uri', direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- {native: 'fhr.assemblyAuthor[].name', core: 'assembly.assemblyAuthor[].name', direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: 'fhr.assemblyAuthor[].uri', core: 'assembly.assemblyAuthor[].uri', direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- native: fhr.dateCreated
  core: assembly.dateCreated
  direction: both
  transform: null
  lossy: null
  example: {native: '2023-08-24', core: '2023-08-24', file: examples/api_genome_rAllMis1_hb4YkEfHXM1SKbAwU_ZOXyLB0_ZjHHvr.json}
- {native: fhr.voucherSpecimen, core: assembly.voucherSpecimen, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- native: fhr.accessionID.name
  core: assembly.accessions
  direction: both
  transform:
    accession: {other: unspecified}
  lossy: FHR accessionID is any archive's id (the upstream example has PBARC, inherited from the 2022 field 'place');
    refmeta treats it as the assembly accession.
  example:
    native: GCA_000001405.15
    core: {namespace: insdc.gca, value: GCA_000001405.15}
    file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json
- native: fhr.accessionID.url
  core: assembly.accessions[0].url
  direction: both
  transform: null
  lossy: null
  example: {native: 'https://www.ncbi.nlm.nih.gov/datasets/genome/GCA_000001405.15/', core: 'https://www.ncbi.nlm.nih.gov/datasets/genome/GCA_000001405.15/',
    file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- {native: fhr.instrument, core: assembly.instrument, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.scholarlyArticle, core: assembly.scholarlyArticle, direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- native: fhr.documentation
  core: assembly.documentation
  direction: both
  transform: null
  fallback: [collection.description, assembly.description]
  lossy: null
  example: {native: 'Homo sapiens GRCh38 no-alt analysis set (GCA_000001405.15, UCSC-style names), distributed by
      NCBI GenBank and redistributed identically by Broad, iGenomes, a...', core: 'Homo sapiens GRCh38 no-alt analysis
      set (GCA_000001405.15, UCSC-style names), distributed by NCBI GenBank and redistributed identically by Broad,
      iGenomes, a...', file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json, truncated: true}
- native: fhr.identifier
  core: assembly.identifier
  direction: both
  transform: null
  lossy: null
  example:
    native: &id003 ['bioproject:PRJNA1006701', 'biosample:SAMN37045233']
    core: *id003
    file: examples/api_genome_rAllMis1_hb4YkEfHXM1SKbAwU_ZOXyLB0_ZjHHvr.json
- native: fhr.relatedLink
  core: assembly.relatedLink
  direction: both
  transform: null
  lossy: null
  example:
    native: &id004 ['https://lh3.github.io/2017/11/13/which-human-reference-genome-to-use', 'ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz']
    core: *id004
    file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json
- {native: fhr.funding, core: assembly.funding, direction: both, transform: null, lossy: null, example: null, note: No
    example file sets this field.}
- {native: fhr.license, core: assembly.reuseConditions, direction: both, transform: null, lossy: 'gtars/refgenie
    field, not FHR. Shares the core field with FHR reuseConditions (an SPDX id there, free text in FHR).', example: null,
  note: No example file sets this field.}
- {native: fhr.masking, core: 'copies[kind=fasta].masking', direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.vitalStats.totalBasePairs, core: assembly.vitalStats.totalBasePairs, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: fhr.vitalStats.N50, core: assembly.vitalStats.N50, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.vitalStats.L50, core: assembly.vitalStats.L50, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.vitalStats.L90, core: assembly.vitalStats.L90, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.vitalStats.numberContigs, core: assembly.vitalStats.numberContigs, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: fhr.vitalStats.numberScaffolds, core: assembly.vitalStats.numberScaffolds, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: fhr.vitalStats.readTechnology, core: assembly.vitalStats.readTechnology, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- native: fhr.checksum
  core: copies[kind=fasta].uncompressedChecksums.sha256
  direction: both
  transform:
    prefix: {strip: 'sha256:'}
  lossy: null
  example: null
  note: refgenie writes 'sha256:<hex>' of the uncompressed FASTA here, not the FHR SHA-512/256 form.
- native: fhr.assemblySource
  core: collection.provider
  direction: both
  transform: null
  lossy: Values are not normalized (ncbi, NCBI, Ensembl, UCSC).
  example: {native: ncbi, core: ncbi, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: fhr.assemblyLevel
  core: assembly.level
  direction: both
  transform: null
  lossy: null
  example: {native: chromosome, core: chromosome, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: species.taxon_id
  core: assembly.taxon.speciesId
  direction: both
  transform: null
  lossy: The species row of the server's species list; equal to taxon_id in all collected records.
  example: {native: 9606, core: 9606, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: species.scientific_name
  core: assembly.taxon.name
  direction: both
  transform: null
  lossy: null
  example: {native: Homo sapiens, core: Homo sapiens, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: species.common_name
  core: assembly.taxon.commonName
  direction: both
  transform: null
  lossy: null
  example: {native: human, core: human, file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
- native: refget_store_url
  core: deployments[system=refget_store].location
  direction: both
  transform: null
  lossy: null
  example: {native: 'https://refgenie.s3.us-east-1.amazonaws.com/refget-store/jungle/', core: 'https://refgenie.s3.us-east-1.amazonaws.com/refget-store/jungle/',
    file: examples/api_genome_hg38_EiFob05aCWgVU_B_Ae0cypnQut3cxUP1.json}
unmapped:
- {native: fhr.schema, reason: FHR schema URL written by the exporter.}
- {native: fhr.schemaVersion, reason: FHR version written by the exporter (the number 1.0).}
- {native: species.synonyms, reason: Other names of the species (baker's yeast); core keeps one common name.}
