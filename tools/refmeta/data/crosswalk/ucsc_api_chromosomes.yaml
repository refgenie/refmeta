# refmeta crosswalk: ucsc_api_chromosomes <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: ucsc_api_chromosomes
source: ucsc
core: '0.1'
subject: collection
description: 'REST API /list/chromosomes: sequence names and lengths of one UCSC database or hub genome; one record
  per sequence.'
records:
  mode: group
  group_by: [genome, hubUrl]
  rows: {target: sequences, key: null, explode: null}
notes: Rows come in the API's order. With a 'track' filter the list holds only sequences found in that track, so
  counts are not derived.
constants: {}
derive: []
rules:
- native: genome
  core: collection.labels[namespace=ucsc].value
  direction: both
  transform: null
  lossy: null
  example: {native: hg38, core: hg38, file: examples/api_list_chromosomes_hg38.json}
- native: hubUrl
  core: deployments[system=ucsc,table=hub].location
  direction: both
  transform: null
  lossy: null
  example: {native: /gbdb/genark/GCF/000/146/045/GCF_000146045.2/hub.txt, core: /gbdb/genark/GCF/000/146/045/GCF_000146045.2/hub.txt,
    file: examples/api_list_chromosomes_GCF_000146045.2.json}
- native: chrom
  core: sequences[].name
  direction: both
  transform: null
  lossy: null
  example: {native: chr1, core: chr1, file: examples/api_list_chromosomes_hg38.json}
- native: size
  core: sequences[].length
  direction: both
  transform: null
  lossy: null
  example: {native: 248956422, core: 248956422, file: examples/api_list_chromosomes_hg38.json}
unmapped:
- {native: track, per: record, reason: Track filter of the request.}
