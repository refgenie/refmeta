# refmeta crosswalk: refgenie_registry_genome <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: refgenie_registry_genome
source: refgenie
core: '0.1'
subject: collection
description: One genome entry of the refgenie-registry (genomes/<organism>/<name>.yaml), validated by schema/genome.schema.yaml.
  Each entry is one named sequence collection (one exact set of sequences, pinned by seqcol.digest) plus organism,
  assembly accession, FASTA download URLs, optional FHR provenance, and registry build instructions.
records: {mode: each}
notes: 'One registry entry is one named sequence collection, pinned by seqcol.digest. The assembly accession does
  not identify the entry: several entries share GCA_000001405.15.'
constants: {}
derive: []
rules:
- native: name
  core: collection.aliases[namespace=refgenie].value
  direction: both
  transform: null
  lossy: null
  example: {native: hg38, core: hg38, file: examples/registry_genome_hg38.yaml}
- native: aliases
  core: collection.aliases[namespace=refgenie].value
  direction: both
  transform: null
  lossy: Registry name and aliases share the refgenie namespace; on write this list also holds the name.
  example:
    native: &id001 [GRCh38]
    core: *id001
    file: examples/registry_genome_hg38.yaml
- native: description
  core: collection.description
  direction: both
  transform: null
  lossy: null
  example: {native: 'GRCh38 (hg38) no-alt analysis set from NCBI (GCA_000001405.15): primary

      chromosomes, unplaced and unlocalized scaffolds, chrM and chrEBV, with no ALT

      haploty...', core: 'GRCh38 (hg38) no-alt analysis set from NCBI (GCA_000001405.15): primary

      chromosomes, unplaced and unlocalized scaffolds, chrM and chrEBV, with no ALT

      haploty...', file: examples/registry_genome_hg38.yaml, truncated: true}
- native: organism.scientific_name
  core: assembly.taxon.name
  direction: both
  transform: null
  lossy: null
  example: {native: Homo sapiens, core: Homo sapiens, file: examples/registry_genome_hg38.yaml}
- native: organism.taxon_id
  core: assembly.taxon.id
  direction: both
  transform: null
  lossy: null
  example: {native: 9606, core: 9606, file: examples/registry_genome_hg38.yaml}
- native: assembly.source
  core: collection.provider
  direction: both
  transform: null
  lossy: Despite its key, it names who distributed the sequence set (UCSC vs Ensembl for the same assembly), so
    it maps to the collection, not the assembly.
  example: {native: NCBI, core: NCBI, file: examples/registry_genome_hg38.yaml}
- native: assembly.accession
  core: assembly.accessions
  direction: both
  transform:
    accession: {}
  lossy: null
  example:
    native: GCA_000001405.15
    core: {namespace: insdc.gca, value: GCA_000001405.15}
    file: examples/registry_genome_hg38.yaml
- native: assembly.level
  core: assembly.level
  direction: both
  transform: null
  lossy: null
  example: {native: chromosome, core: chromosome, file: examples/registry_genome_hg38.yaml}
- {native: masking, core: 'copies[kind=fasta].masking', direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- native: fasta.sources[].url
  core: copies[kind=fasta].location
  direction: both
  transform: null
  lossy: null
  example:
    native: &id002 ['ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz',
      'https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GRCh38_major_release_seqs_for_alignment_pipelines/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz']
    core: *id002
    file: examples/registry_genome_hg38.yaml
- native: fasta.sources[].provider
  core: copies[kind=fasta].provider
  direction: both
  transform: null
  lossy: null
  example:
    native: &id003 [NCBI, NCBI]
    core: *id003
    file: examples/registry_genome_hg38.yaml
- native: fasta.checksum.md5
  core: copies[kind=fasta].checksums.md5
  direction: both
  transform: null
  lossy: One checksum for possibly several source URLs; it is attached to the first one.
  example: {native: a08035b6a6e31780e96a34008ff21bd6, core: a08035b6a6e31780e96a34008ff21bd6, file: examples/registry_genome_hg38.yaml}
- {native: fasta.checksum.sha256, core: 'copies[kind=fasta].uncompressedChecksums.sha256', direction: both, transform: null,
  missing: compute_on_registration, lossy: null, example: null, note: 'Every collected registry entry has the sentinel
    ''compute_on_registration'', which means absent.'}
- native: seqcol.digest
  core: collection.digest
  direction: both
  transform: null
  lossy: null
  example: {native: EiFob05aCWgVU_B_Ae0cypnQut3cxUP1, core: EiFob05aCWgVU_B_Ae0cypnQut3cxUP1, file: examples/registry_genome_hg38.yaml}
- native: seqcol.length
  core: collection.nSequences
  direction: both
  transform: null
  lossy: null
  example: {native: 195, core: 195, file: examples/registry_genome_hg38.yaml}
- {native: fhr.license, core: assembly.reuseConditions, direction: both, transform: null, lossy: SPDX id in the
    registry; shares the core field with FHR reuseConditions., example: null, note: No example file sets this field.}
- {native: fhr.funding, core: assembly.funding, direction: both, transform: null, lossy: null, example: null, note: No
    example file sets this field.}
- {native: fhr.scholarly_article, core: assembly.scholarlyArticle, direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- native: fhr.date_created
  core: assembly.dateCreated
  direction: both
  transform: null
  lossy: null
  example: {native: '2023-08-24', core: '2023-08-24', file: examples/registry_genome_rAllMis1.yaml}
- {native: fhr.voucher_specimen, core: assembly.voucherSpecimen, direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- {native: fhr.documentation, core: assembly.documentation, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.instrument, core: assembly.instrument, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.related_link, core: assembly.relatedLink, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- native: fhr.identifier
  core: assembly.identifier
  direction: both
  transform: null
  lossy: null
  example:
    native: &id004 ['bioproject:PRJNA1006701', 'biosample:SAMN37045233']
    core: *id004
    file: examples/registry_genome_rAllMis1.yaml
- {native: 'fhr.metadata_author[].name', core: 'provenance[0].authors[].name', direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: 'fhr.metadata_author[].uri', core: 'provenance[0].authors[].uri', direction: both, transform: null, lossy: null,
  example: null, note: No example file sets this field.}
- {native: 'fhr.assembly_author[].name', core: 'assembly.assemblyAuthor[].name', direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: 'fhr.assembly_author[].uri', core: 'assembly.assemblyAuthor[].uri', direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: fhr.vital_stats.n50, core: assembly.vitalStats.N50, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.vital_stats.l50, core: assembly.vitalStats.L50, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.vital_stats.l90, core: assembly.vitalStats.L90, direction: both, transform: null, lossy: null, example: null,
  note: No example file sets this field.}
- {native: fhr.vital_stats.total_base_pairs, core: assembly.vitalStats.totalBasePairs, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: fhr.vital_stats.number_contigs, core: assembly.vitalStats.numberContigs, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: fhr.vital_stats.number_scaffolds, core: assembly.vitalStats.numberScaffolds, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- {native: fhr.vital_stats.read_technology, core: assembly.vitalStats.readTechnology, direction: both, transform: null,
  lossy: null, example: null, note: No example file sets this field.}
- native: build.store
  core: deployments[system=refget_store].scope
  direction: both
  transform: null
  lossy: null
  example: {native: legacy, core: legacy, file: examples/registry_genome_hg38.yaml}
- native: metadata.added
  core: provenance[0].recordDate
  direction: both
  transform: null
  lossy: null
  example: {native: '2026-05-20', core: '2026-05-20', file: examples/registry_genome_hg38.yaml}
- native: metadata.added_by
  core: provenance[0].authors[0].name
  direction: both
  transform: null
  lossy: A GitHub user name, written as an author name.
  example: {native: nsheff, core: nsheff, file: examples/registry_genome_hg38.yaml}
unmapped:
- {native: seqcol.compute, reason: 'Instruction to the registry build (compute the digest), not a fact.'}
- {native: build.tier, reason: Registry build plan (which assets to build).}
- {native: build.add, reason: Registry build plan.}
- {native: build.drop, reason: Registry build plan.}
- {native: metadata.last_verified, reason: When a curator last checked the URL; no core field.}
