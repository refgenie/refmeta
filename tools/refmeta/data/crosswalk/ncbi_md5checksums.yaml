# refmeta crosswalk: ncbi_md5checksums <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: ncbi_md5checksums
source: ncbi
core: '0.1'
subject: copy
description: 'FTP md5checksums.txt in each assembly directory: ''<md5>  ./<file name>'' per file, for the files
  as served (compressed .gz files are checksummed compressed).'
records:
  mode: group
  group_by: []
  rows: {target: copies, key: null, explode: null}
constants: {}
derive: []
rules:
- native: file
  core: copies[].location
  direction: both
  transform:
    prefix: {strip: ./}
  lossy: null
  example: {native: ./GCA_000001405.15_GRCh38_GRC_exclusions.bed, core: GCA_000001405.15_GRCh38_GRC_exclusions.bed,
    file: examples/ftp_GCA_000001405.15_GRCh38_analysis_set_md5checksums.txt}
  note: Relative to the assembly's FTP directory.
- native: md5sum
  core: copies[].checksums.md5
  direction: both
  transform: null
  lossy: null
  example: {native: bf5c011e0342f355422144eb3547b5d0, core: bf5c011e0342f355422144eb3547b5d0, file: examples/ftp_GCA_000001405.15_GRCh38_analysis_set_md5checksums.txt}
  note: Of the file as served (compressed bytes for .gz).
unmapped: []
