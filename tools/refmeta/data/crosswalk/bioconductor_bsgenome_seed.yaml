# refmeta crosswalk: bioconductor_bsgenome_seed <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: bioconductor_bsgenome_seed
source: bioconductor
core: '0.1'
subject: deployment
description: 'BSgenomeForge seed file: a DCF (Debian Control File) holding everything forgeBSgenomeDataPkg() needs
  to build a BSgenome data package. Bioconductor keeps its seeds in BSgenomeForge/inst/extdata/seeds/. Two classes
  share the format: BSgenomeDataPkgSeed (bare sequences) and MaskedBSgenomeDataPkgSeed (masked packages, with RefPkgname
  and *files_* fields).'
records: {mode: each}
constants: {}
derive: []
rules:
- native: Package
  core: deployments[system=bioconductor].key
  direction: both
  transform: null
  lossy: null
  example: {native: BSgenome.Hsapiens.UCSC.hg38, core: BSgenome.Hsapiens.UCSC.hg38, file: examples/bsgenome_seed_BSgenome.Hsapiens.UCSC.hg38-seed}
- native: organism
  core: assembly.taxon.name
  direction: both
  transform: null
  lossy: null
  example: {native: Homo sapiens, core: Homo sapiens, file: examples/bsgenome_seed_BSgenome.Hsapiens.UCSC.hg38-seed}
- native: common_name
  core: assembly.taxon.commonName
  direction: both
  transform: null
  lossy: null
  example: {native: Human, core: Human, file: examples/bsgenome_seed_BSgenome.Hsapiens.UCSC.hg38-seed}
- native: genome
  core: collection.labels[namespace=bioconductor].value
  direction: both
  transform: null
  lossy: null
  example: {native: hg38, core: hg38, file: examples/bsgenome_seed_BSgenome.Hsapiens.UCSC.hg38-seed}
- native: provider_version
  core: collection.labels[namespace=bioconductor].value
  direction: both
  transform: null
  lossy: null
  example: {native: sacCer3, core: sacCer3, file: examples/bsgenome_seed_BSgenome.Scerevisiae.UCSC.sacCer3-seed}
  note: Deprecated name of genome.
- native: provider
  core: collection.provider
  direction: both
  transform: null
  lossy: null
  example: {native: UCSC, core: UCSC, file: examples/bsgenome_seed_BSgenome.Hsapiens.UCSC.hg38-seed}
- native: release_date
  core: assembly.releaseDate
  direction: both
  transform:
    date: {format: '%Y/%m/%d'}
  lossy: Free text; only YYYY/MM/DD values convert. Others (April 2011, 2013-12-17) stay in extras.
  example: {native: 2023/01/31, core: '2023-01-31', file: examples/bsgenome_seed_BSgenome.Hsapiens.UCSC.hg38-seed}
- native: release_name
  core: assembly.description
  direction: both
  transform: null
  lossy: null
  example: {native: SGD April 2011 sequence, core: SGD April 2011 sequence, file: examples/bsgenome_seed_BSgenome.Scerevisiae.UCSC.sacCer3-seed}
- native: source_url
  core: copies[0].location
  direction: both
  transform: null
  lossy: Often a download directory, not one file.
  example: {native: 'https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/p14/', core: 'https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/p14/',
    file: examples/bsgenome_seed_BSgenome.Hsapiens.UCSC.hg38-seed}
unmapped:
- {native: Title, reason: Package title.}
- {native: Description, reason: Package description.}
- {native: Version, reason: Package version.}
- {native: Author, reason: Package author.}
- {native: Maintainer, reason: Package maintainer.}
- {native: Suggests, reason: Package dependency.}
- {native: License, reason: 'Package license, not the genome''s terms.'}
- {native: organism_biocview, reason: biocViews term.}
- {native: BSgenomeObjname, reason: R object name.}
- {native: seqnames, reason: R expression for the sequence names.}
- {native: circ_seqs, reason: R expression for the circular sequences.}
- {native: mseqnames, reason: R expression.}
- {native: PkgDetails, reason: Man page text.}
- {native: SrcDataFiles, reason: Free text naming the source files.}
- {native: PkgExamples, reason: R code.}
- {native: seqs_srcdir, reason: Local build folder.}
- {native: seqfile_name, reason: Source 2bit file name in the build folder.}
- {native: seqfiles_prefix, reason: 'Package build setting (file name parts, mask sources).'}
- {native: seqfiles_suffix, reason: 'Package build setting (file name parts, mask sources).'}
- {native: ondisk_seq_format, reason: 'Package build setting (file name parts, mask sources).'}
- {native: citation_file, reason: 'Package build setting (file name parts, mask sources).'}
- {native: RefPkgname, reason: 'Package build setting (file name parts, mask sources).'}
- {native: nmask_per_seq, reason: 'Package build setting (file name parts, mask sources).'}
- {native: masks_srcdir, reason: 'Package build setting (file name parts, mask sources).'}
- {native: AGAPSfiles_type, reason: 'Package build setting (file name parts, mask sources).'}
- {native: AGAPSfiles_name, reason: 'Package build setting (file name parts, mask sources).'}
- {native: AGAPSfiles_prefix, reason: 'Package build setting (file name parts, mask sources).'}
- {native: AGAPSfiles_suffix, reason: 'Package build setting (file name parts, mask sources).'}
- {native: RMfiles_name, reason: 'Package build setting (file name parts, mask sources).'}
- {native: RMfiles_prefix, reason: 'Package build setting (file name parts, mask sources).'}
- {native: RMfiles_suffix, reason: 'Package build setting (file name parts, mask sources).'}
- {native: TRFfiles_name, reason: 'Package build setting (file name parts, mask sources).'}
- {native: TRFfiles_prefix, reason: 'Package build setting (file name parts, mask sources).'}
- {native: TRFfiles_suffix, reason: 'Package build setting (file name parts, mask sources).'}
