# refmeta crosswalk: galaxy_loc_rnastar_index2x_versioned <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: galaxy_loc_rnastar_index2x_versioned
source: galaxy
core: '0.1'
subject: deployment
description: 'Galaxy rnastar_index2x_versioned.loc: STAR index directory per row. TAB-separated, ''#'' comments,
  no header; column names come from tool_data_table_conf.xml: value, dbkey, name, path, with_gene_model, version.'
records: {mode: each}
constants: {}
derive: []
rules:
- native: value
  core: deployments[system=galaxy,table=rnastar_index2x_versioned].key
  direction: both
  transform: null
  lossy: null
  example: {native: hg38, core: hg38, file: examples/cvmfs_rnastar_index2x_versioned.loc}
- native: dbkey
  core: collection.labels[namespace=galaxy.dbkey].value
  direction: both
  transform: null
  lossy: null
  example: {native: hg38, core: hg38, file: examples/cvmfs_rnastar_index2x_versioned.loc}
- native: name
  core: deployments[system=galaxy,table=rnastar_index2x_versioned].displayName
  direction: both
  transform: null
  lossy: null
  example: {native: 'Human (Homo sapiens) (b38): hg38', core: 'Human (Homo sapiens) (b38): hg38', file: examples/cvmfs_rnastar_index2x_versioned.loc}
- native: path
  core: copies[kind=star_index].location
  direction: both
  transform: null
  lossy: null
  example: {native: /cvmfs/data.galaxyproject.org/managed/rnastar/2.7.4a/hg38/hg38/dataset_fdfceb86-2b00-45f3-a3f4-63794ea8182d_files,
    core: /cvmfs/data.galaxyproject.org/managed/rnastar/2.7.4a/hg38/hg38/dataset_fdfceb86-2b00-45f3-a3f4-63794ea8182d_files,
    file: examples/cvmfs_rnastar_index2x_versioned.loc}
- native: path
  core: deployments[system=galaxy,table=rnastar_index2x_versioned].location
  direction: both
  transform: null
  lossy: null
  example: {native: /cvmfs/data.galaxyproject.org/managed/rnastar/2.7.4a/hg38/hg38/dataset_fdfceb86-2b00-45f3-a3f4-63794ea8182d_files,
    core: /cvmfs/data.galaxyproject.org/managed/rnastar/2.7.4a/hg38/hg38/dataset_fdfceb86-2b00-45f3-a3f4-63794ea8182d_files,
    file: examples/cvmfs_rnastar_index2x_versioned.loc}
- native: version
  core: copies[kind=star_index].toolVersion
  direction: both
  transform: null
  lossy: null
  example: {native: 2.7.4a, core: 2.7.4a, file: examples/cvmfs_rnastar_index2x_versioned.loc}
  note: The oldest STAR version that can read the index.
unmapped:
- {native: with_gene_model, reason: Whether the index was built with a GTF; no core field.}
