# refmeta crosswalk: ena_portal_assembly <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: ena_portal_assembly
source: ena
core: '0.1'
subject: assembly
description: ENA Portal API search result=assembly, fields=all, as TSV (format=tsv) or JSON (format=json). One row
  per assembly version.
records: {mode: each}
constants: {}
derive: []
rules:
- native: assembly_set_accession
  core: assembly.accessions
  direction: both
  transform:
    accession: {}
  lossy: null
  example:
    native: GCA_000001405.15
    core: {namespace: insdc.gca, value: GCA_000001405.15}
    file: examples/portal_assembly_GCA_000001405.15.json
- native: version
  core: assembly.version
  direction: both
  transform:
    cast: {to: string, from: integer}
  lossy: null
  example: {native: 15, core: '15', file: examples/portal_assembly_GCA_000001405.15.json}
- native: assembly_name
  core: assembly.name
  direction: both
  transform: null
  lossy: null
  example: {native: GRCh38, core: GRCh38, file: examples/portal_assembly_GCA_000001405.15.json}
- native: assembly_title
  core: assembly.description
  direction: both
  transform: null
  lossy: null
  example: {native: Genome Reference Consortium Human Build 38, core: Genome Reference Consortium Human Build 38,
    file: examples/portal_assembly_GCA_000001405.15.json}
- native: description
  core: assembly.description
  direction: both
  transform: null
  lossy: null
  example: {native: Genome Reference Consortium Human Build 38, core: Genome Reference Consortium Human Build 38,
    file: examples/portal_assembly_GCA_000001405.15.json}
- native: description_comment
  core: assembly.documentation
  direction: both
  transform: null
  lossy: null
  example: {native: 'The DNA sequence is composed of genomic sequence, primarily finished clones that were sequenced
      as part of the Human Genome Project. PCR products and WGS sho...', core: 'The DNA sequence is composed of
      genomic sequence, primarily finished clones that were sequenced as part of the Human Genome Project. PCR products
      and WGS sho...', file: examples/portal_assembly_GCA_000001405.15.json, truncated: true}
- native: sample_accession
  core: assembly.biosample
  direction: both
  transform: null
  lossy: null
  example: {native: SAMEA5569141, core: SAMEA5569141, file: examples/other/portal_assembly_GCA_902167145.1.tsv}
- native: program
  core: assembly.assemblySoftware[0].name
  direction: both
  transform: null
  lossy: Name and version in one string.
  example: {native: Canu 1.8, core: Canu 1.8, file: examples/other/portal_assembly_GCA_902167145.1.tsv}
- native: common_name
  core: assembly.taxon.commonName
  direction: both
  transform: null
  lossy: null
  example: {native: maize, core: maize, file: examples/other/portal_assembly_GCA_902167145.1.tsv}
- native: last_updated
  core: provenance[0].recordDate
  direction: both
  transform: null
  lossy: null
  example: {native: '2019-02-28', core: '2019-02-28', file: examples/portal_assembly_GCA_000001405.15.json}
- native: genome_representation
  core: assembly.representation
  direction: both
  transform: null
  lossy: null
  example: {native: full, core: full, file: examples/portal_assembly_GCA_000001405.15.json}
- native: center_name
  core: assembly.submitter
  direction: both
  transform: null
  lossy: null
  example: {native: Genome Reference Consortium, core: Genome Reference Consortium, file: examples/portal_assembly_GCA_000001405.15.json}
- native: assembly_level
  core: assembly.level
  direction: both
  transform: null
  lossy: null
  example: {native: chromosome, core: chromosome, file: examples/portal_assembly_GCA_000001405.15.json}
- native: first_created
  core: assembly.releaseDate
  direction: both
  transform: null
  lossy: ENA's first-created date, a few days after NCBI's release date.
  example: {native: '2013-12-21', core: '2013-12-21', file: examples/portal_assembly_GCA_000001405.15.json}
- native: strain
  core: assembly.taxon.strain
  direction: both
  transform: null
  lossy: null
  example: {native: S288C, core: S288C, file: examples/portal_assembly_GCA_000146045.2.json}
- native: cultivar
  core: assembly.taxon.strain
  direction: both
  transform: null
  lossy: null
  example: {native: B73, core: B73, file: examples/other/portal_assembly_GCA_902167145.1.tsv}
- native: scientific_name
  core: assembly.taxon.name
  direction: both
  transform: null
  lossy: null
  example: {native: Homo sapiens, core: Homo sapiens, file: examples/portal_assembly_GCA_000001405.15.json}
- native: tax_id
  core: assembly.taxon.id
  direction: both
  transform: null
  lossy: null
  example: {native: 9606, core: 9606, file: examples/portal_assembly_GCA_000001405.15.json}
- native: study_accession
  core: assembly.bioproject
  direction: both
  transform: null
  lossy: null
  example: {native: PRJNA31257, core: PRJNA31257, file: examples/portal_assembly_GCA_000001405.15.json}
- native: platform
  core: assembly.instrument
  direction: both
  transform:
    split: {sep: ', '}
  lossy: null
  example:
    native: PacBio SEQUEL
    core: [PacBio SEQUEL]
    file: examples/other/portal_assembly_GCA_902167145.1.tsv
- native: coverage
  core: assembly.vitalStats.coverage
  direction: both
  transform: null
  missing: 0
  lossy: null
  example: {native: 83, core: 83, file: examples/other/portal_assembly_GCA_902167145.1.tsv}
- native: base_count
  core: assembly.vitalStats.totalBasePairs
  direction: both
  transform: null
  lossy: Counts every sequence including alt loci.
  example: {native: 3209286105, core: 3209286105, file: examples/portal_assembly_GCA_000001405.15.json}
