# refmeta crosswalk: galaxy_loc_all_fasta <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: galaxy_loc_all_fasta
source: galaxy
core: '0.1'
subject: deployment
description: 'Galaxy all_fasta.loc: one FASTA file per row (data table all_fasta). TAB-separated, ''#'' comments,
  no header; column names come from tool_data_table_conf.xml: value, dbkey, name, path.'
records: {mode: each}
constants: {}
derive: []
rules:
- native: value
  core: deployments[system=galaxy,table=all_fasta].key
  direction: both
  transform: null
  lossy: null
  example: {native: hg38female, core: hg38female, file: examples/cvmfs_all_fasta.loc}
- native: dbkey
  core: collection.labels[namespace=galaxy.dbkey].value
  direction: both
  transform: null
  lossy: null
  example: {native: hg38, core: hg38, file: examples/cvmfs_all_fasta.loc}
- native: name
  core: deployments[system=galaxy,table=all_fasta].displayName
  direction: both
  transform: null
  lossy: null
  example: {native: 'Human (Homo sapiens) (b38): hg38 Canonical Female', core: 'Human (Homo sapiens) (b38): hg38
      Canonical Female', file: examples/cvmfs_all_fasta.loc}
- native: path
  core: copies[kind=fasta].location
  direction: both
  transform: null
  lossy: null
  example: {native: /cvmfs/data.galaxyproject.org/byhand/hg38/seq/hg38female.fa, core: /cvmfs/data.galaxyproject.org/byhand/hg38/seq/hg38female.fa,
    file: examples/cvmfs_all_fasta.loc}
- native: path
  core: deployments[system=galaxy,table=all_fasta].location
  direction: both
  transform: null
  lossy: null
  example: {native: /cvmfs/data.galaxyproject.org/byhand/hg38/seq/hg38female.fa, core: /cvmfs/data.galaxyproject.org/byhand/hg38/seq/hg38female.fa,
    file: examples/cvmfs_all_fasta.loc}
unmapped: []
