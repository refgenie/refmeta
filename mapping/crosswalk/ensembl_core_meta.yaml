- {native: genebuild.id, reason: 'Database, annotation or website setting; no core field.'}
- {native: assembly.mapping, reason: Coordinate system mappings inside the database.}
- {native: genebuild.last_geneset_update, reason: 'Database, annotation or website setting; no core field.'}
