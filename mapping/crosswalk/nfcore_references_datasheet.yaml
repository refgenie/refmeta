# refmeta crosswalk: nfcore_references_datasheet <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: nfcore_references_datasheet
source: nfcore
core: '0.1'
subject: collection
description: 'nf-core/references asset datasheet: a YAML list, one entry per genome, listing the files (and a few
  tool values) available for it. Published in nf-core/references-datasheets (igenomes/, genomes/, genomes_source/)
  and validated by schema_references.json in the nf-core/references pipeline.'
records: {mode: each}
constants: {}
derive: []
rules:
- native: genome
  core: deployments[system=nfcore_references].key
  direction: both
  transform: null
  lossy: null
  example: {native: GRCh38, core: GRCh38, file: examples/datasheet_igenomes_NCBI_GRCh38.yml}
- native: genome
  core: collection.labels[namespace=nfcore].value
  direction: both
  transform: null
  lossy: A build name, not unique on its own (species + source + genome is).
  example: {native: GRCh38, core: GRCh38, file: examples/datasheet_igenomes_NCBI_GRCh38.yml}
- native: species
  core: assembly.taxon.name
  direction: both
  transform:
    replace: {old: _, new: ' '}
  lossy: null
  example: {native: Homo_sapiens, core: Homo sapiens, file: examples/datasheet_igenomes_NCBI_GRCh38.yml}
- native: reference_source
  core: collection.provider
  direction: both
  transform: null
  lossy: null
  example: {native: NCBI, core: NCBI, file: examples/datasheet_igenomes_NCBI_GRCh38.yml}
- native: source
  core: collection.provider
  direction: both
  transform: null
  lossy: null
  example: {native: nf-core/references, core: nf-core/references, file: examples/datasheet_legacy_nf-core_references_main_test_default_extended.yml}
  note: Older name of reference_source.
- native: reference_version
  core: assembly.accessions
  direction: both
  transform:
    accession: {}
  lossy: Seen once (GCF_000001635.27 for mm39).
  example:
    native: GCF_000001635.27
    core: {namespace: insdc.gcf, value: GCF_000001635.27}
    file: examples/datasheet_nonanchor_genomes_source_NCBI_mm39.yml
- native: fasta
  core: copies[kind=fasta].location
  direction: both
  transform: null
  lossy: null
  example: {native: '${params.references_base_path}/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.fa',
    core: '${params.references_base_path}/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.fa', file: examples/datasheet_igenomes_NCBI_GRCh38.yml}
- native: fasta_fai
  core: copies[kind=fai].location
  direction: both
  transform: null
  lossy: null
  example: {native: '${params.references_base_path}/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.fa.fai',
    core: '${params.references_base_path}/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.fa.fai', file: examples/datasheet_igenomes_NCBI_GRCh38.yml}
- native: fasta_dict
  core: copies[kind=dict].location
  direction: both
  transform: null
  lossy: null
  example: {native: '${params.references_base_path}/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.dict',
    core: '${params.references_base_path}/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.dict', file: examples/datasheet_igenomes_NCBI_GRCh38.yml}
- native: fasta_sizes
  core: copies[kind=chrom_sizes].location
  direction: both
  transform: null
  lossy: null
  example: {native: 'https://raw.githubusercontent.com/nf-core/test-datasets/references/references/GRCh38_chr21/GRCh38_chr21.fa.sizes',
    core: 'https://raw.githubusercontent.com/nf-core/test-datasets/references/references/GRCh38_chr21/GRCh38_chr21.fa.sizes',
    file: examples/datasheet_genomes_nf-core_GRCh38_chr21.yml}
- native: chrom_info
  core: copies[kind=chrom_info].location
  direction: both
  transform: null
  lossy: null
  example: {native: '${params.references_base_path}/Saccharomyces_cerevisiae/UCSC/sacCer3/Annotation/Genes/ChromInfo.txt',
    core: '${params.references_base_path}/Saccharomyces_cerevisiae/UCSC/sacCer3/Annotation/Genes/ChromInfo.txt',
    file: examples/datasheet_igenomes_UCSC_sacCer3.yml}
