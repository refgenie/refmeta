# refmeta crosswalk: bioconductor_chrominfo_ucsc <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: bioconductor_chrominfo_ucsc
source: bioconductor
core: '0.1'
subject: collection
description: GenomeInfoDb getChromInfoFromUCSC() result as cached in GenomeInfoDb/inst/chrominfo_db/UCSC/<genome>.tab
  (written by saveChromInfoFromUCSC()). One record per sequence of a UCSC genome.
records:
  mode: group
  group_by: []
  rows: {target: sequences, key: null, explode: null}
constants: {collection.namingAuthority: ucsc}
derive: [counts]
rules:
- native: chrom
  core: sequences[].name
  direction: both
  transform: null
  lossy: null
  example: {native: chr1, core: chr1, file: examples/chrominfo_ucsc_hg38.tab}
- native: size
  core: sequences[].length
  direction: both
  transform: null
  lossy: null
  example: {native: 248956422, core: 248956422, file: examples/chrominfo_ucsc_hg38.tab}
- native: assembled
  core: sequences[].role
  direction: both
  transform:
    map:
      values: {'true': assembled-molecule}
      other: drop
  lossy: Only TRUE maps (to assembled-molecule); FALSE says only 'not assembled' and gives no role.
  example: {native: true, core: assembled-molecule, file: examples/chrominfo_ucsc_hg38.tab}
- native: circular
  core: sequences[].circular
  direction: both
  transform: null
  lossy: null
  example: {native: false, core: false, file: examples/chrominfo_ucsc_hg38.tab}
unmapped: []
