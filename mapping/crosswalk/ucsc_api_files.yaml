# refmeta crosswalk: ucsc_api_files <-> core 0.1. Format: mapping/CROSSWALK_FORMAT.md
crosswalk: 1
format: ucsc_api_files
source: ucsc
core: '0.1'
subject: copy
description: 'REST API /list/files: downloadable files of one UCSC or GenArk genome; one record per file (path,
  size, time).'
records:
  mode: group
  group_by: [genome]
  rows: {target: copies, key: null, explode: null}
constants: {}
derive: []
rules:
- native: genome
  core: collection.labels[namespace=ucsc].value
  direction: both
  transform: null
  lossy: null
  example: {native: hg38, core: hg38, file: examples/api_list_files_hg38_bigZips_excerpt.json}
- native: url
  core: copies[].location
  direction: both
  transform: null
  lossy: Relative to the download server root; the host is not in the record.
  example: {native: goldenPath/hg38/bigZips/README.txt, core: goldenPath/hg38/bigZips/README.txt, file: examples/api_list_files_hg38_bigZips_excerpt.json}
- native: sizeBytes
  core: copies[].size
  direction: both
  transform: null
  lossy: null
  example: {native: 14126, core: 14126, file: examples/api_list_files_hg38_bigZips_excerpt.json}
- native: dateTime
  core: copies[].modified
  direction: both
  transform:
    date: {format: '%Y/%m/%dT%H:%M:%S'}
  lossy: null
  example: {native: '2023/02/23T18:25:33', core: '2023-02-23T18:25:33', file: examples/api_list_files_hg38_bigZips_excerpt.json}
unmapped:
- {native: rsyncHost, per: record, reason: rsync host of the download server; envelope.}
