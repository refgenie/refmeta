openapi: 3.0.1
info:
  title: NCBI Datasets API
  version: v2
  description: '### NCBI Datasets is a resource that lets you easily gather data from NCBI.

    The NCBI Datasets version 2 API is updated often to add new features, fix bugs, and enhance usability.

    '
  x-refmeta-excerpt: 'Excerpt by refmeta: only the two genome report GET endpoints and the component schemas
    they reference (transitively). Full file: https://www.ncbi.nlm.nih.gov/datasets/docs/v2/openapi3/openapi3.docs.yaml
    retrieved 2026-11-17.'
servers:
- url: https://api.ncbi.nlm.nih.gov/datasets/v2
paths:
  /genome/accession/{accessions}/dataset_report:
    get:
      summary: Get a genome assembly report by genome assembly accession
      description: 'Get a genome assembly report by assembly accession. By default, in paged JSON format,
        but also available in tabular (accept: text/tab-separated-values) or JSON Lines (accept: application/x-ndjson)
        formats.'
      tags:
      - Genome
      operationId: genome_dataset_report
      responses:
        default:
          description: An unexpected error response.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2reportsAssemblyDataReportPage'
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/v2reportsAssemblyDataReportPage'
            text/tab-separated-values:
              schema:
                type: string
      parameters:
      - name: accessions
        description: One or more genome assembly accessions, limited to 100
        in: path
        required: true
        schema:
          type: array
          items:
            type: string
        examples:
          example-0:
            value: GCF_000001405.40
            summary: Human reference genome assembly, GRCh38.p14
          example-1:
            value:
            - GCF_000001405.40
            - GCF_000001635.27
            summary: Human and mouse reference genomes, GRCh38.p14 and GRCm39
      - name: filters.reference_only
        description: If true, limit to reference genome assemblies.
        in: query
        required: false
        schema:
          type: boolean
          default: false
        examples:
          example-0:
            value: true
            summary: Limit to reference genomes
          example-1:
            value: false
            summary: Include all genomes
      - name: filters.assembly_source
        description: Limit to either RefSeq (GCF_) or GenBank (GCA_) genome assemblies.
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2AssemblyDatasetDescriptorsFilterAssemblySource'
          default: all
        examples:
          example-0:
            value: refseq
            summary: Limit to RefSeq genomes
          example-1:
            value: genbank
            summary: Limit to GenBank genomes
          example-2:
            value: all
            summary: Include all genomes
      - name: filters.has_annotation
        description: Limit to annotated genome assemblies.
        in: query
        required: false
        schema:
          type: boolean
          default: false
        examples:
          example-0:
            value: true
            summary: Limit to annotated genomes
          example-1:
            value: false
            summary: Include all genomes
      - name: filters.exclude_paired_reports
        description: If true, for GenBank (GCA_)/RefSeq (GCF_) pairs, returns the RefSeq copy. When no
          RefSeq copy exists, the GenBank assembly is returned.
        in: query
        required: false
        schema:
          type: boolean
          default: false
        examples:
          example-0:
            value: false
            summary: Include all genomes, including both members of a GenBank/RefSeq pair
          example-1:
            value: true
            summary: Returns the RefSeq copy for GenBank/RefSeq pairs, otherwise returns the GenBank assembly
      - name: filters.exclude_atypical
        description: If true, exclude [atypical genome assemblies](https://www.ncbi.nlm.nih.gov/datasets/docs/v2/data-processing/policies-annotation/genome-processing/genome_notes/#atypical-assemblies),
          i.e., genomes that have assembly issues or are otherwise atypical.
        in: query
        required: false
        schema:
          type: boolean
          default: false
        examples:
          example-0:
            value: false
            summary: Include all genomes
          example-1:
            value: true
            summary: Limit to genomes that are not atypical
      - name: filters.assembly_version
        description: Limit to the most recent (current) version of a genome assembly.
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2AssemblyDatasetDescriptorsFilterAssemblyVersion'
          default: current
        examples:
          example-0:
            value: current
            summary: Limit to the most recent version of a genome assembly
          example-1:
            value: all_assemblies
            summary: Include all genome assemblies
      - name: filters.assembly_level
        description: Limit to genomes at the specified [assembly level](https://www.ncbi.nlm.nih.gov/datasets/docs/v2/glossary/#assembly-level)
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsAssemblyLevel'
        examples:
          example-0:
            value:
            - chromosome
            - complete_genome
            summary: Chromosome-level and complete genomes
          example-1:
            value:
            - scaffold
            - chromosome
            - complete_genome
            summary: Scaffold-level genomes and higher
      - name: filters.first_release_date
        description: Limit to genomes released on or after the specified date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        examples:
          example-0:
            value: '2024-01-10'
            summary: January 10th, 2024, in ISO 8601 YYYY-MM-DD format
      - name: filters.last_release_date
        description: Limit to genomes released on or before the specified date
        in: query
        required: false
        schema:
          type: string
          format: date-time
        examples:
          example-0:
            value: '2025-01-10'
            summary: January 10th, 2025, in ISO 8601 YYYY-MM-DD format
      - name: filters.search_text
        description: Limit to genomes that match the specified submitter name, assembly name, infraspecific
          name (or modifier), or organism name.
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        examples:
          example-0:
            value: Genome Reference Consortium
            summary: Limit to genomes that match this submitter name
          example-1:
            value: GRCh38
            summary: Limit to genomes that match this assembly name
          example-2:
            value: C57BL/6J
            summary: Limit to genomes that match this strain name, a type of infraspecific name
      - name: filters.is_metagenome_derived
        description: Exclude or limit to metagenome-assembled genomes (MAGs).
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2AssemblyDatasetDescriptorsFilterMetagenomeDerivedFilter'
        examples:
          example-0:
            value: metagenome_derived_exclude
            summary: Exclude metagenome-assembled genomes, or MAGs
          example-1:
            value: metagenome_derived_only
            summary: Limit to metagenome-assembled genomes, or MAGs
      - name: filters.is_type_material
        description: If true, limit to genomes derived from type material.
        in: query
        required: false
        schema:
          type: boolean
          default: false
        examples:
          example-0:
            value: false
            summary: Include all genomes
          example-1:
            value: true
            summary: Limit to genomes derived from type material
      - name: filters.is_ictv_exemplar
        description: If true, limit to genomes derived from an ICTV exemplar (only applies to virus genomes).
        in: query
        required: false
        schema:
          type: boolean
          default: false
        examples:
          example-0:
            value: false
            summary: Include all genomes
          example-1:
            value: true
            summary: Limit to genomes derived from an ICTV exemplar
      - name: filters.exclude_multi_isolate
        description: If true, exclude genomes that were sequenced as part of large multi-isolate projects.
        in: query
        required: false
        schema:
          type: boolean
          default: false
        examples:
          example-0:
            value: false
            summary: Include all genomes
          example-1:
            value: true
            summary: Exclude genomes that were sequenced as part of large multi-isolate projects
      - name: filters.type_material_category
        description: Limit to genomes derived from specific type material categories.
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2AssemblyDatasetDescriptorsFilterTypeMaterialCategory'
        examples:
          example-0:
            value: TYPE_MATERIAL_CLADE
            summary: Limit to genomes designated as clade exemplar
          example-1:
            value: TYPE_MATERIAL_NEOTYPE
            summary: Limit to genomes derived from neotype material
      - name: table_fields
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        examples:
          example-0:
            value: accession
            summary: Genome assembly accession
          example-1:
            value:
            - accession
            - assminfo-name
            summary: Genome assembly accession and name
      - name: returned_content
        description: Return complete genome assembly reports, or abbreviated reports with assembly accessions
          with or without paired assembly information.
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2AssemblyDatasetReportsRequestContentType'
        examples:
          example-0:
            value: ASSM_ACC
            summary: Return abbreviated report with genome assembly accessions
          example-1:
            value: PAIRED_ACC
            summary: Return abbreviated report with genome assembly accessions and paired assembly information
      - name: page_size
        description: The maximum number of genome assembly reports to return. Default is 20 and maximum
          is 1000. If the number of results exceeds the page size, `page_token` can be used to retrieve
          the remaining results.
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: page_token
        description: A page token is returned when the results count exceeds `page size`. Use this token
          along with previous request parameters to retrieve the next page of results. When `page_token`
          is empty, all results have been retrieved.
        in: query
        required: false
        schema:
          type: string
      - name: sort.field
        in: query
        required: false
        schema:
          type: string
      - name: sort.direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2SortDirection'
      - name: include_tabular_header
        description: Specify when to include the table header when requesting a tabular report.
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2IncludeTabularHeader'
  /genome/accession/{accession}/sequence_reports:
    get:
      summary: Get a genome sequence report by genome assembly accession
      description: 'Get a genome sequence report by genome assembly accession. By default, in paged JSON
        format, but also available in tabular (accept: text/tab-separated-values) or JSON Lines (accept:
        application/x-ndjson) formats.'
      tags:
      - Genome
      operationId: genome_sequence_report
      responses:
        default:
          description: An unexpected error response.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2SequenceReportPage'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/v2SequenceReportPage'
            text/tab-separated-values:
              schema:
                type: string
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/v2SequenceReportPage'
      parameters:
      - name: accession
        description: A single genome assembly accession
        in: path
        required: true
        schema:
          type: string
        examples:
          example-0:
            value: GCF_000001635.27
            summary: Mouse reference genome assembly, GRCm39
          example-1:
            value: GCF_000001405.40
            summary: Human reference genome assembly, GRCh38.p14
      - name: chromosomes
        description: Limit to sequences with the specified chromosome names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        examples:
          example-0:
            value:
            - '1'
            - MT
            summary: Chromosome 1 and mitochondrial genome sequence
          example-1:
            value:
            - X
            - Y
            summary: Human sex chromosomes X and Y
      - name: role_filters
        description: Limit to sequences with the specified "role", where possible roles are `assembled-molecule`,
          `unlocalized-scaffold`, or `unplaced-scaffold`
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        examples:
          example-0:
            value: assembled-molecule
            summary: Assembled sequences
      - name: table_fields
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        examples:
          example-0:
            value:
            - accession
            - chr-name
            summary: Genome assembly accession and chromosome name
          example-1:
            value: ucsc-style-name
            summary: Sequence name from the UCSC Genome Browser
      - name: count_assembly_unplaced
        description: Include the count of unplaced scaffold sequences
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page_size
        description: The maximum number of genome assemblies to return. Maximum is 1000. If the number
          of results exceeds the page size, `page_token` can be used to retrieve the remaining results.
        in: query
        required: false
        schema:
          type: integer
      - name: page_token
        description: A page token is returned when the results count exceeds `page size`. Use this token
          along with previous request parameters to retrieve the next page of results. When `page_token`
          is empty, all results have been retrieved.
        in: query
        required: false
        schema:
          type: string
      - name: include_tabular_header
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/v2IncludeTabularHeader'
components:
  schemas:
    protobufAny:
      type: object
      properties:
        type_url:
          type: string
        value:
          type: string
          format: byte
    rpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/protobufAny'
    v2AssemblyDatasetDescriptorsFilterAssemblySource:
      type: string
      enum:
      - all
      - refseq
      - genbank
      default: all
    v2AssemblyDatasetDescriptorsFilterAssemblyVersion:
      type: string
      enum:
      - current
      - all_assemblies
      default: current
      title: The assembly status - current (latest), or all assemblies, which adds replaced and suppressed
    v2AssemblyDatasetDescriptorsFilterMetagenomeDerivedFilter:
      type: string
      enum:
      - METAGENOME_DERIVED_UNSET
      - metagenome_derived_only
      - metagenome_derived_exclude
      default: METAGENOME_DERIVED_UNSET
    v2AssemblyDatasetDescriptorsFilterTypeMaterialCategory:
      type: string
      enum:
      - NONE
      - TYPE_MATERIAL
      - TYPE_MATERIAL_CLADE
      - TYPE_MATERIAL_NEOTYPE
      - TYPE_MATERIAL_REFTYPE
      - PATHOVAR_TYPE
      - TYPE_MATERIAL_SYN
      default: NONE
    v2AssemblyDatasetReportsRequestContentType:
      type: string
      enum:
      - COMPLETE
      - ASSM_ACC
      - PAIRED_ACC
      default: COMPLETE
    v2IncludeTabularHeader:
      type: string
      enum:
      - INCLUDE_TABULAR_HEADER_FIRST_PAGE_ONLY
      - INCLUDE_TABULAR_HEADER_ALWAYS
      - INCLUDE_TABULAR_HEADER_NEVER
      default: INCLUDE_TABULAR_HEADER_FIRST_PAGE_ONLY
    v2SequenceReportPage:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsSequenceInfo'
        total_count:
          type: integer
          title: The total count of available datasets (ignoring the cutoff parameter). Only provided
            for the first page of results (when `page_token` is empty in the request).
        next_page_token:
          type: string
          title: A token that can be sent as `page_token` to retrieve the next page. If this field is
            omitted, there are no subsequent pages.
    v2SortDirection:
      type: string
      enum:
      - SORT_DIRECTION_UNSPECIFIED
      - SORT_DIRECTION_ASCENDING
      - SORT_DIRECTION_DESCENDING
      default: SORT_DIRECTION_UNSPECIFIED
    v2reportsANIMatch:
      type: object
      properties:
        assembly:
          type: string
          title: Accession of the submitted organism best match type-strain assembly or best match type-strain
            assembly
        organism_name:
          type: string
          title: Taxonomic name of the submitted organism or best match type-strain organism
        category:
          $ref: '#/components/schemas/v2reportsANITypeCategory'
          title: Type category
        ani:
          type: number
          format: float
          title: Percent average nucleotide identity
        assembly_coverage:
          type: number
          format: float
          title: Percent coverage of the query assembly by the submitted organism or best match type assembly
        type_assembly_coverage:
          type: number
          format: float
          title: Percent coverage of the submitted organism or best match type assembly by the query assembly
    v2reportsANITypeCategory:
      type: string
      enum:
      - ANI_CATEGORY_UNKNOWN
      - claderef
      - category_na
      - neotype
      - no_type
      - pathovar
      - reftype
      - suspected_type
      - synonym
      - type
      default: ANI_CATEGORY_UNKNOWN
    v2reportsAdditionalSubmitter:
      type: object
      properties:
        genbank_accession:
          type: string
          title: genbank accession of extra sequence
        refseq_accession:
          type: string
          title: genbank accession of extra sequence
        chr_name:
          type: string
          title: chromosome name
        molecule_type:
          type: string
          title: molecule type
        submitter:
          type: string
          title: Name of submitter
        bioproject_accession:
          type: string
          title: Bioproject accession
    v2reportsAnnotationInfo:
      type: object
      properties:
        name:
          type: string
          title: Annotation name
        provider:
          type: string
          title: Source of the annotation
        release_date:
          type: string
          title: Annotation release date
        report_url:
          type: string
          title: Annotation report web address
        stats:
          $ref: '#/components/schemas/v2reportsFeatureCounts'
        busco:
          $ref: '#/components/schemas/v2reportsBuscoStat'
        method:
          type: string
          title: Software tools used to calculate annotation
        pipeline:
          type: string
          title: NCBI annotation pipeline used to calculate annotation
        software_version:
          type: string
          title: NCBI annotation pipeline software version
        status:
          type: string
          title: Type of annotation
        release_version:
          type: string
    v2reportsAssemblyDataReport:
      type: object
      properties:
        accession:
          type: string
          title: The GenColl assembly accession
        current_accession:
          type: string
          title: The latest GenColl assembly accession for this revision chain
        paired_accession:
          type: string
          title: The GenBank or RefSeq assembly accession paired with this assembly
        source_database:
          $ref: '#/components/schemas/v2reportsSourceDatabase'
          title: Source of the accession. The paired accession, if it exists, is from the other database.
        organism:
          $ref: '#/components/schemas/v2reportsOrganism'
        assembly_info:
          $ref: '#/components/schemas/v2reportsAssemblyInfo'
          title: Metadata for the genome assembly submission
        assembly_stats:
          $ref: '#/components/schemas/v2reportsAssemblyStats'
          title: Global statistics for the genome assembly
        organelle_info:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsOrganelleInfo'
        additional_submitters:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsAdditionalSubmitter'
        annotation_info:
          $ref: '#/components/schemas/v2reportsAnnotationInfo'
          title: Metadata and statistics for the genome assembly annotation, when available
        wgs_info:
          $ref: '#/components/schemas/v2reportsWGSInfo'
          title: Metadata pertaining to the Whole Genome Shotgun (WGS) record for the genome assemblies  that
            are complete genomes. Those that are clone-based do not have WGS-master records.
        type_material:
          $ref: '#/components/schemas/v2reportsTypeMaterial'
        checkm_info:
          $ref: '#/components/schemas/v2reportsCheckM'
          title: Metadata on the completeness and contamination of this assembly
        average_nucleotide_identity:
          $ref: '#/components/schemas/v2reportsAverageNucleotideIdentity'
    v2reportsAssemblyDataReportPage:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsAssemblyDataReport'
        content_type:
          $ref: '#/components/schemas/v2reportsContentType'
        total_count:
          type: integer
          title: The total count of available datasets (ignoring the page_size parameter).
        next_page_token:
          type: string
          title: A token that can be sent as `page_token` to retrieve the next page. If this field is
            omitted, there are no subsequent pages.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsMessage'
    v2reportsAssemblyInfo:
      type: object
      properties:
        assembly_level:
          type: string
          title: The level at which a genome has been assembled
        assembly_status:
          $ref: '#/components/schemas/v2reportsAssemblyStatus'
          title: The GenColl assembly status
        paired_assembly:
          $ref: '#/components/schemas/v2reportsPairedAssembly'
          title: Metadata from the GenBank or RefSeq assembly paired with this one
        assembly_name:
          type: string
          title: The assembly submitter's name for the genome assembly, when provided. Otherwise, a default
            name in the  form ASM#####v# is assigned
        assembly_long_name:
          type: string
        assembly_type:
          type: string
          title: Chromosome content of the submitted genome assembly
        bioproject_lineage:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsBioProjectLineage'
        bioproject_accession:
          type: string
        submission_date:
          type: string
          title: Date the assembly was submitted to NCBI (being replaced by release date - should maintain
            until most CLI users upgrade)
        release_date:
          type: string
          title: Date the assembly was made available by NCBI. This field is not returned by versions
            of the datasets Command Line Interface (CLI) program < 15.
        description:
          type: string
          title: Long description for this genome
        submitter:
          type: string
          title: The submitting consortium or organization. Full submitter information is available in
            the BioProject
        refseq_category:
          type: string
          title: The RefSeq Category, if present, indicates whether the assembly is a reference genome
        synonym:
          type: string
          title: Genome name ascribed to this assembly by the UC Santa Cruz genome browser
        linked_assembly:
          type: string
          title: The accession.version and designation (principal or alternate pseudohaplotype) of a paired
            genome assembly derived from the same diploid individual
        linked_assemblies:
          type: array
          items:
            $ref: '#/components/schemas/v2reportsLinkedAssembly'
        atypical:
          $ref: '#/components/schemas/v2reportsAtypicalInfo'
          title: Information on atypical genomes - genomes that have assembly issues or are otherwise
            atypical
        genome_notes:
          type: array
          items:
            type: string
        sequencing_tech:
          type: string
          title: Sequencing technology used to sequence this genome
        assembly_method:
          type: string
          title: Genome assembly method
        grouping_method:
          type: string
          title: Version of the NCBI Virus segmented genome grouping pipeline, which groups  nucleotide
            sequences for segmented viruses into a single genome assembly. For more  information, see
            the [NCBI Virus Help Documentation](https://www.ncbi.nlm.nih.gov/labs/virus/vssi/docs/help/#virus_segment_grouping)
        biosample:
          $ref: '#/components/schemas/v2reportsBioSampleDescriptor'
          title: NCBI BioSample from which the sequences in the genome assembly were obtained.
        blast_url:
          type: string
          title: URL to blast page for this assembly
        comments:
          type: string
          title: Freeform comments
        suppression_reason:
          type: string
          title: The reason for the assembly is suppressed, for suppressed assemblies
        diploid_role:
          $ref: '#/components/schemas/v2reportsLinkedAssemblyType'
    v2reportsAssemblyLevel:
      type: string
      enum:
      - chromosome
      - scaffold
      - contig
      - complete_genome
      default: chromosome
      title: 'The level of the genome assembly: Chromosome, Scaffold, Contig or Complete Genome'
    v2reportsAssemblyStats:
      type: object
      properties:
        total_number_of_chromosomes:
          type: integer
          title: Count of nuclear chromosomes, organelles and plasmids in a submitted genome assembly
        total_sequence_length:
          type: string
          format: uint64
          title: Total sequence length of the nuclear genome including unplaced and unlocalized sequences
        total_ungapped_length:
          type: string
          format: uint64
          title: Total length of all top-level sequences ignoring gaps. Any stretch of 10 or more Ns in
            a sequence is treated like a gap
        number_of_contigs:
          type: integer
          title: Total number of sequence contigs in the assembly. Any stretch of 10 or more Ns in a sequence
            is treated as a gap between two  contigs in a scaffold when counting contigs and calculating
            contig N50 & L50 values
        contig_n50:
          type: integer
          title: Length such that sequence contigs of this length or longer include half the bases of
            the assembly
        contig_l50:
          type: integer
          title: Number of sequence contigs that are longer than, or equal to, the N50 length and therefore
            include half the bases of the assembly
        number_of_scaffolds:
          type: integer
          title: Number of scaffolds including placed, unlocalized, unplaced, alternate loci and patch
            scaffolds
        scaffold_n50:
          type: integer
          title: Length such that scaffolds of this length or longer include half the bases of the assembly
        scaffold_l50:
          type: integer
          title: Number of scaffolds that are longer than, or equal to, the N50 length and therefore include
            half the bases of the assembly
        gaps_between_scaffolds_count:
          type: integer
          title: Number of unspanned gaps between scaffolds
        number_of_component_sequences:
          type: integer
