name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Package data and site data are up to date
        run: |
          uv run python sync_data.py --check
          uv run python build_web.py --check
          uv run python build_terms.py --check
          uv run python build_sssom.py --check
      - run: uv run pytest -q

  pages:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Serve the SSSOM sets and core schema at their ids
        run: |
          cp -r mapping/sssom web/sssom
          mkdir -p web/core/0.1
          cp mapping/core.schema.json web/core/0.1/core.schema.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
